{% extends 'base.html' %} {% block content %}
<main class="auth-shell" data-page="forgot">
  <section class="auth-card">
    <div class="auth-header">
      <h1>Forgot Password</h1>
      <p>Update your password to sign in again.</p>
    </div>
    <form id="forgot-form" class="auth-form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
      <label for="forgot-email">Email</label>
      <input
        id="forgot-email"
        name="email"
        type="email"
        placeholder="ava@bank.com"
        required
      />

      <label for="forgot-password">New Password</label>
      <input
        id="forgot-password"
        name="password"
        type="password"
        placeholder="Enter your new password"
        minlength="8"
        required
      />

      <label for="forgot-confirm-password">Confirm Password</label>
      <input
        id="forgot-confirm-password"
        name="confirm_password"
        type="password"
        placeholder="Confirm your new password"
        minlength="8"
        required
      />

      <button class="auth-btn" type="submit">Update Password</button>
    </form>
    <div class="message" id="forgot-message"></div>
    <p class="auth-footnote">
      <a href="/login">Back to Sign In</a>
    </p>
  </section>
</main>
{% endblock %}
