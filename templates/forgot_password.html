{% extends 'base.html' %} {% block content %}
<main class="auth-shell" data-page="forgot" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <section class="auth-card" style="max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-lg);">
    <!-- Header -->
    <div class="auth-header" style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(14, 165, 233, 0.1); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin: 0 0 0.35rem 0;">Reset Password</h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 0;">Enter your account email to set a new password</p>
    </div>

    <!-- Form -->
    <form id="forgot-form" class="auth-form" style="display: flex; flex-direction: column; gap: 1.15rem;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="forgot-email" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Account Email</label>
        <input
          id="forgot-email"
          name="email"
          type="email"
          placeholder="you@domain.com"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <div class="form-group">
        <label for="forgot-password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">New Password</label>
        <input
          id="forgot-password"
          name="password"
          type="password"
          placeholder="Enter new password (min 8 chars)"
          minlength="8"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <div class="form-group">
        <label for="forgot-confirm-password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Confirm New Password</label>
        <input
          id="forgot-confirm-password"
          name="confirm_password"
          type="password"
          placeholder="Repeat new password"
          minlength="8"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <button class="auth-btn btn primary" type="submit" style="width: 100%; padding: 0.8rem 1.25rem; font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Update Password
      </button>
    </form>

    <div class="message" id="forgot-message" style="margin-top: 0.75rem;"></div>

    <!-- Footer -->
    <div class="auth-footnote" style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.85rem;">
      <a href="/login" style="color: var(--accent); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.35rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Sign In
      </a>
    </div>
  </section>
</main>
{% endblock %}
