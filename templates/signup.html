{% extends 'base.html' %} {% block content %}
<main class="auth-shell" data-page="signup" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
  <section class="auth-card" style="max-width: 480px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-lg);">
    <!-- Header -->
    <div class="auth-header" style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin: 0 0 0.35rem 0;">Open an Account</h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 0;">Instant setup with bank-grade 256-bit encryption</p>
    </div>

    <!-- Form -->
    <form
      id="signup-form"
      method="POST"
      action="/api/signup"
      class="auth-form"
      novalidate
      style="display: flex; flex-direction: column; gap: 1.15rem;"
    >
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="signup-name" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Full Legal Name</label>
        <input
          id="signup-name"
          name="name"
          type="text"
          placeholder="Ava Banks"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <div class="form-group">
        <label for="signup-email" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
        <input
          id="signup-email"
          name="email"
          type="email"
          placeholder="you@domain.com"
          autocomplete="email"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <div class="field-group form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="signup-password" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin: 0;">Password</label>
          <span style="font-size: 0.72rem; color: var(--text-tertiary);">Min 8 characters</span>
        </div>
        <div class="password-field" style="position: relative;">
          <input
            id="signup-password"
            name="password"
            type="password"
            placeholder="Create a strong password"
            required
            autocomplete="new-password"
            aria-required="true"
            style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 2.75rem 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
          />
          <button
            type="button"
            class="password-toggle"
            data-target="signup-password"
            aria-label="Show password"
            aria-pressed="false"
            style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--text-tertiary); padding: 0.2rem;"
          >
            <span class="password-toggle-icon" aria-hidden="true">👁</span>
          </button>
        </div>
      </div>

      <div class="field-group form-group">
        <label for="signup-confirm-password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Confirm Password</label>
        <div class="password-field" style="position: relative;">
          <input
            id="signup-confirm-password"
            name="confirm_password"
            type="password"
            placeholder="Repeat password"
            autocomplete="new-password"
            style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 2.75rem 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
          />
          <button
            type="button"
            class="password-toggle"
            data-target="signup-confirm-password"
            aria-label="Show confirm password"
            aria-pressed="false"
            style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1rem; cursor: pointer; color: var(--text-tertiary); padding: 0.2rem;"
          >
            <span class="password-toggle-icon" aria-hidden="true">👁</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="signup-pin" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin: 0;">Create Transaction PIN</label>
          <span style="font-size: 0.72rem; color: var(--accent); font-weight: 600;">4 to 6 numeric digits</span>
        </div>
        <input
          id="signup-pin"
          name="pin"
          type="password"
          inputmode="numeric"
          pattern="\d{4,6}"
          placeholder="••••"
          required
          maxlength="6"
          style="letter-spacing: 0.35em; font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary);"
        />
        <span style="display: block; font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.25rem;">Used to authenticate all deposits, withdrawals, and transfers.</span>
      </div>

      <button id="signup-submit" class="auth-btn btn primary" type="submit" style="width: 100%; padding: 0.8rem 1.25rem; font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Register Account
      </button>
    </form>

    <div id="signup-message" class="auth-message message" aria-live="polite" style="margin-top: 0.75rem;"></div>

    <!-- Footer -->
    <div class="auth-footnote" style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account?
      <a href="/login" style="color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 0.25rem;">Sign In</a>
    </div>
  </section>
</main>
{% endblock %}
