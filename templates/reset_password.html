{% extends 'base.html' %} {% block content %}
<div class="reset-password-container" style="max-width: 480px; margin: 0 auto; padding: 2rem 1rem;">
  <header class="page-header" style="margin-bottom: 1.5rem; text-align: center;">
    <div style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
      <span class="badge" style="background: rgba(14, 165, 233, 0.1); color: var(--accent); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 9999px;">Secure Reset</span>
    </div>
    <h2 style="font-size: 1.625rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; margin: 0 0 0.35rem 0;">Set New Password</h2>
    <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 0;">Enter your new authorized account password to complete verification.</p>
  </header>

  <section class="card form-card" data-page="reset" data-token="{{ token }}" style="padding: 2rem; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow-sm);">
    <form id="reset-form" style="display: flex; flex-direction: column; gap: 1.25rem;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="reset-password" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">New Password</label>
        <input
          id="reset-password"
          name="password"
          type="password"
          placeholder="Enter new password (min 8 chars)"
          minlength="8"
          required
          style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
        />
      </div>

      <button class="btn primary" type="submit" style="width: 100%; padding: 0.8rem 1.25rem; font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Save New Password
      </button>
    </form>
    <div class="message" id="reset-message" style="margin-top: 1rem;"></div>
  </section>
</div>
{% endblock %}
