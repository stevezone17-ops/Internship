{% extends 'base.html' %} {% block content %}
<main class="auth-shell" data-page="login" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
  <section class="auth-card" style="max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-lg);">
    <!-- Header -->
    <div class="auth-header" style="text-align: center; margin-bottom: 1.75rem;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent) 0%, #1e40af 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.02em; margin: 0 0 0.35rem 0;">Welcome Back</h1>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin: 0;">Sign in to your Simple Banking secure treasury account</p>
    </div>

    <!-- Form -->
    <form id="login-form" method="POST" action="/api/login" class="auth-form" style="display: flex; flex-direction: column; gap: 1.15rem;">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label for="login-email" style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">Email Address</label>
        <div style="position: relative;">
          <input
            id="login-email"
            name="email"
            type="email"
            placeholder="you@domain.com"
            autocomplete="email"
            required
            style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
          />
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="login-password" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin: 0;">Password</label>
          <a class="auth-forgot-link" href="/forgot" style="font-size: 0.78rem; color: var(--accent); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>
        <div class="password-field" style="position: relative;">
          <input
            id="login-password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            style="width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.68rem 2.5rem 0.68rem 1rem; background: var(--bg); color: var(--text-primary); font-size: 0.95rem;"
          />
        </div>
      </div>

      <button class="auth-btn btn primary" type="submit" style="width: 100%; padding: 0.8rem 1.25rem; font-weight: 600; font-size: 0.98rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Sign In to Portal
      </button>

      <div class="message" id="login-message" style="margin-top: 0.5rem;"></div>
    </form>

    <!-- Footer -->
    <div class="auth-footnote" style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-secondary);">
      Don't have an account yet?
      <a href="/signup" style="color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 0.25rem;">Create Account</a>
    </div>
  </section>
</main>
{% endblock %}
